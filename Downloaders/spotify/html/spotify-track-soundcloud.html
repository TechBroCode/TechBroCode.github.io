        // Generate a unique callback name each time
        function makeCallbackName() {
            return '__native_cb_' + Math.random().toString(36).slice(2);
        }

        window.nativeFetch = function (input, init = {}) {
            const {
                method = 'GET',
                headers = {},
                body = null,
                responseType = 'text'  // 'text'|'json'|'image'|'video'
            } = init;

            return new Promise((resolve, reject) => {
                const cbName = makeCallbackName();
                // Define the callback that the Java side will call:
                window[cbName] = function (payload) {
                    delete window[cbName];
                    if (payload.success) {
                        if (responseType === 'json') {
                            try {
                                payload.parsedBody = JSON.parse(payload.body);
                            } catch (e) {
                                return reject(
                                    new TypeError('Failed to parse JSON: ' + e.message)
                                );
                            }
                        }
                        resolve(payload);
                    } else {
                        const err = new Error(payload.statusText || 'Network Error');
                        err.payload = payload;
                        reject(err);
                    }
                };

                // Kick off the native call:
                JetPlay.executeApiRequest(
                    input,
                    method,
                    body != null ? JSON.stringify(body) : null,
                    Object.keys(headers).length ? JSON.stringify(headers) : null,
                    responseType,
                    cbName
                );
            });
        };
