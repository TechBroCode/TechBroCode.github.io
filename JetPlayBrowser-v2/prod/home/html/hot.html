        /**
         * A tiny Linkvertise client in plain JS.
         */
        class LinkvertiseClient {
            /**
             * @param {Object} [opts]
             * @param {string} [opts.baseUrl] — Override the default short-link domain.
             */
            constructor({baseUrl} = {}) {
                this.linkvertiseUrl = baseUrl || 'https://link-to.net';
            }

            /**
             * Base64-encodes an ASCII string.
             * @param {string} str
             * @returns {string}
             */
            _btoa(str) {
                // Since URLs are ASCII, window.btoa is safe here.
                return window.btoa(str);
            }

            /**
             * Produces a Linkvertise-style short link.
             *
             * @param {number|string} userId — your Linkvertise publisher ID
             * @param {string} targetUrl — the URL to monetize
             * @returns {string} — the monetized short URL
             */
            linkvertise(userId, targetUrl) {
                // 1) URI-encode the target (preserving Linkvertise’s “safe” set):
                const safeEncoded = encodeURIComponent(targetUrl)
                    // encodeURIComponent encodes ! ' ( ) *, but linkvertise.py’s safe includes: ~@#$&()*!+=:;,.?/'
                    .replace(/[!'()*]/g, c => '%' + c.charCodeAt(0).toString(16))
                    // now re-insert any truly safe chars per the Python wrapper:
                    .replace(/%7E/g, '~')
                    .replace(/%40/g, '@')
                    .replace(/%23/g, '#')
                    .replace(/%24/g, '$')
                    .replace(/%26/g, '&')
                    .replace(/%2A/g, '*')
                    .replace(/%21/g, '!')
                    .replace(/%2B/g, '+')
                    .replace(/%3D/g, '=')
                    .replace(/%3A/g, ':')
                    .replace(/%3B/g, ';')
                    .replace(/%2C/g, ',')
                    .replace(/%2E/g, '.')
                    .replace(/%2F/g, '/')
                    .replace(/%3F/g, '?')
                    .replace(/%27/g, "'");

                // 2) Base-64 encode:
                const b64 = this._btoa(safeEncoded);

                // 3) Build the URL:
                const randPart = (Math.random() * 1000).toString();
                const base = `${this.linkvertiseUrl}/${userId}/${randPart}/dynamic`;

                return `${base}?r=${b64}`;
            }
        }

        // Expose globally (optional, since classes declared in head are global by default)
        window.LinkvertiseClient = LinkvertiseClient;
    </script>
